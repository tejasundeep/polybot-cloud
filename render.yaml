services:
  - type: web
    name: polybot-cloud
    runtime: node
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: POLYBOT_RUNNER_URL
        sync: false
      - key: POLYBOT_AUTH_TOKEN
        sync: false
